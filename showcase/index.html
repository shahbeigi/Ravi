<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#071f21" />
<title>راوی · نقشه‌ی زنده‌ی کمپین</title>
<meta name="description" content="ارائه‌ی راوی به شکل یک نقشه‌ی زنده‌ی کمپین: هفت لنز روی همان نقشه، برای گوینده‌ای که هنگام صحبت بین قابلیت‌ها جابه‌جا می‌شود." />
<style>
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-900.woff2") format("woff2");font-weight:900}
:root{--sig:#e9b65f;--sig-hi:#ffd98e;--mint:#7fc8b6;--red:#f19b8c;--ink:#e8efea;--ink2:#a2bab3;--gl:rgba(255,255,255,.1);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#061c1e}
body{background:radial-gradient(ellipse at 32% 48%,#15474a 0,#0a2e30 42%,#061c1e 100%);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,a,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
::selection{background:var(--sig);color:#0b3032}
#cv{position:fixed;inset:0;z-index:0;cursor:default}
.ui{position:fixed;inset:0;z-index:1;pointer-events:none}
.ui>*{pointer-events:auto}
#fade{position:fixed;inset:0;z-index:5;background:#061c1e;opacity:0;pointer-events:none;transition:opacity 1s ease}

/* top */
.top{position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;gap:18px;padding:0 28px;pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:900;white-space:nowrap}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 6px rgba(233,182,95,.14)}
.logo small{font-size:13px;font-weight:500;color:var(--ink2)}
.grow{flex:1}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap}
.live b{color:var(--mint);font-size:16px;font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:lp 1.6s infinite}
@keyframes lp{70%{box-shadow:0 0 0 7px rgba(127,200,182,0)}0%{box-shadow:0 0 0 0 rgba(127,200,182,.5)}}
.cta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--sig);color:#0b3032;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 10px 30px rgba(233,182,95,.25);transition:transform .25s}
.cta:hover{transform:translateY(-2px)}

/* legend */
.legend{position:absolute;top:76px;left:28px;display:flex;gap:14px;font-size:12px;color:var(--ink2);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%}

/* panel */
.panel{position:absolute;right:28px;top:86px;bottom:104px;width:min(420px,33vw);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.card{pointer-events:auto;max-height:100%;overflow-y:auto;scrollbar-width:none;padding:26px 26px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(12,44,46,.86),rgba(7,30,32,.82));border:1px solid var(--gl);box-shadow:0 30px 80px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.card::-webkit-scrollbar{display:none}
.card>*{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.kick{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--sig)}
.kick span{color:var(--ink2);font-weight:500}
.card h1{font-size:clamp(30px,3vw,44px);font-weight:900;line-height:1.3;margin:10px 0 8px}
.card h1 em{font-style:normal;color:var(--sig)}
.card h2{font-size:clamp(34px,3.4vw,50px);font-weight:900;line-height:1.15;margin:12px 0 2px;letter-spacing:-.5px}
.card .sub{font-size:14px;font-weight:700;color:var(--sig-hi)}
.card .line{font-size:15.5px;line-height:1.9;color:#c3d6d0;margin:12px 0 14px}
.specs{display:grid;margin:4px 0 14px}
.specs div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px}
.specs div:last-child{border-bottom:1px solid rgba(255,255,255,.08)}
.specs span{color:var(--ink2);white-space:nowrap}.specs b{text-align:left;font-weight:700}
.ctrl{margin-top:4px}
.nums{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 4px}
.nums div b{display:block;font-size:30px;font-weight:900;line-height:1.15;color:var(--sig-hi);font-variant-numeric:tabular-nums}
.nums div.m b{color:var(--mint)}.nums div.r b{color:var(--red)}
.nums div span{font-size:12px;color:var(--ink2)}
.hint{font-size:12.5px;color:var(--ink2);margin-top:8px;display:flex;align-items:center;gap:6px}
.hint:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sig)}
.deep{display:inline-flex;margin-top:14px;font-size:12.5px;color:var(--ink2);text-decoration:none;border-bottom:1px dashed rgba(162,186,179,.5)}
.deep:hover{color:var(--sig-hi)}
.range{display:grid;gap:6px;margin:8px 0}
.range label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.range label b{color:var(--sig-hi)}
input[type=range]{width:100%;accent-color:var(--sig);direction:ltr}
.box{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--gl);font-size:13.5px;line-height:1.8;margin-top:8px}
.box b{color:var(--sig-hi)}
.claim{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0}
.claim i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;font-style:normal;font-weight:900;flex:none}
.claim.ok i{background:var(--mint);color:#0b3032}.claim.no i{background:#e96f5d;color:#fff}.claim.no span{text-decoration:line-through;text-decoration-color:rgba(241,155,140,.8)}
.alert{display:none;border-color:rgba(241,155,140,.5);background:rgba(60,22,18,.4)}
.alert.on{display:block;animation:up .5s var(--ease) both}
.alert b{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:var(--sig);color:#0b3032;font-weight:900;font-size:13.5px;margin-top:8px}
.btn:disabled{background:var(--mint);cursor:default}
.btn.big{padding:14px 24px;font-size:16px;box-shadow:0 14px 40px rgba(233,182,95,.3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:11px 14px;border-radius:14px;border:1px solid var(--gl);font-size:13.5px;font-weight:700;width:100%;text-align:right}
.switch u{position:relative;width:40px;height:22px;border-radius:12px;background:rgba(255,255,255,.15);flex:none;transition:.25s}
.switch u:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.switch.on{border-color:rgba(241,155,140,.5)}.switch.on u{background:#e96f5d}.switch.on u:after{right:21px}
.ledger{display:grid;gap:6px;margin-top:8px}
.ledger div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;animation:up .4s var(--ease) both}
.ledger em{font-style:normal;font-weight:900;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none}
.ledger small{margin-inline-start:auto;font-size:12px}
.g-A em,.g-B em{background:var(--mint);color:#0b3032}.g-C em{background:#c9984e;color:#0b3032}
.g-A small,.g-B small{color:var(--mint)}.g-C small{color:var(--sig-hi)}
.leads div{display:block}.leads div b{display:block;font-size:13.5px}.leads div span{font-size:12px;color:var(--ink2)}
.name{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--gl);background:rgba(0,0,0,.25);outline:none;font-size:15px;margin-top:6px}
.name:focus{border-color:var(--sig)}
.sw{display:flex;gap:10px;margin:12px 0 4px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:transform .2s}
.sw button.on{border-color:#fff;transform:scale(1.12)}
.brandx{font-size:22px;font-weight:900;margin:12px 0 4px}.brandx em{font-style:normal;color:var(--sig)}

/* lens bar */
.lenses{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:20px;background:rgba(6,26,28,.78);border:1px solid var(--gl);backdrop-filter:blur(10px);max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.lenses::-webkit-scrollbar{display:none}
.lenses button{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:background .25s,color .25s}
.lenses button svg{width:17px;height:17px;flex:none}
.lenses button:hover{color:var(--ink)}
.lenses button.on{background:var(--sig);color:#0b3032}
.lenses .sep{width:1px;background:var(--gl);margin:6px 2px}
.keys{position:absolute;bottom:34px;left:28px;font-size:11.5px;color:var(--ink2);pointer-events:none}
.keys kbd{font-family:inherit;padding:1px 6px;border-radius:5px;border:1px solid var(--gl)}
.note{position:absolute;bottom:34px;right:28px;font-size:11.5px;color:var(--ink2);pointer-events:none}
#tip{position:fixed;z-index:3;min-width:200px;max-width:280px;padding:12px 14px;border-radius:16px;background:rgba(8,30,32,.94);border:1px solid var(--gl);box-shadow:0 20px 50px rgba(0,0,0,.4);font-size:13px;line-height:1.75;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-size:14.5px}
#tip .r{color:var(--red)}#tip .m{color:var(--mint)}#tip .s{color:var(--sig-hi)}

@media (max-width:1180px){.keys,.note{display:none}.lenses button span{display:none}.lenses button.on span{display:inline}}
@media (max-width:860px){
  .top{height:58px;padding:0 14px;gap:10px}.logo small,.live span{display:none}
  .legend{top:62px;left:14px;flex-wrap:wrap;gap:8px 12px}
  .panel{left:12px;right:12px;width:auto;top:auto;bottom:80px;max-height:44vh}
  .card{padding:18px}
  .card h2{font-size:30px}.card h1{font-size:26px}
  .lenses{bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="نقشه‌ی زنده‌ی کمپین"></canvas>
<div id="fade"></div>
<div class="ui">
  <header class="top">
    <button class="logo" data-lens="0" aria-label="آغاز"><i></i><span id="logoName">راوی</span><small>نقشه‌ی زنده‌ی کمپین</small></button>
    <span class="grow"></span>
    <span class="live"><i></i><b id="liveN">۱۶۲</b><span>عامل فعال</span></span>
    <button class="cta" data-dash>ورود به داشبورد ←</button>
  </header>
  <div class="legend" aria-hidden="true"><span><i style="background:#7fc8b6"></i>کار عامل</span><span><i style="background:#e9b65f" id="lgAcc"></i>عدد اثبات‌شده · پرداخت</span><span><i style="background:#e96f5d"></i>مشکوک</span><span><i style="background:#5e7472"></i>برآورد · قطع</span></div>
  <aside class="panel"><div class="card" id="card"></div></aside>
  <nav class="lenses" id="lenses" aria-label="لنزها"></nav>
  <div class="keys"><kbd>۱</kbd>–<kbd>۷</kbd> لنزها · <kbd>←</kbd><kbd>→</kbd> بعدی و قبلی · <kbd>F</kbd> تمام‌صفحه</div>
  <div class="note">نام برند ساختگی · اعداد نمایشی</div>
</div>
<div id="tip"></div>
<noscript>برای دیدن این ارائه، جاوااسکریپت را فعال کنید.</noscript>
<script>
(() => {
  "use strict";
  const $ = (s, e = document) => e.querySelector(s);
  const $$ = (s, e = document) => [...e.querySelectorAll(s)];
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const nf = (n) => fa(Math.round(n).toLocaleString("en-US")).replace(/,/g, "٬");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const Phi = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
  const ease = (u) => (u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
  const MINT = [127, 200, 182], WHITE = [226, 236, 232], RED = [233, 111, 93], GREY = [94, 116, 114], AMBER = [214, 160, 80], TEAL = [74, 132, 122], DIMC = [64, 104, 100];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  /* ================= the campaign map (map units, brand at 0,0) ================= */
  const CH = [
    { n: "روبیکا", sup: 14, dom: true, fmt: "پست", fc: "۱۷۵ تا ۲۴۰ هزار", st: "۸۶٪ هدف", ver: "هر محموله‌ی میلگرد A4 با برگه‌ی آزمون کشش خودش می‌رسد. #تبلیغ" },
    { n: "ایتا", sup: 12, dom: true, fmt: "پست", fc: "۹۵ تا ۱۴۰ هزار", st: "۵۳٪ هدف", ver: "پیش از خرید میلگرد، برگه‌ی آزمون کشش محموله را بخواهید. #تبلیغ" },
    { n: "بله", sup: 8, dom: true, fmt: "پست", fc: "رزرو جایگزین", st: "رزرو", ver: "استعلام قیمت روز میلگرد A4 برای پروژه‌ی شما؛ تحویل در ۱۲ استان. #تبلیغ" },
    { n: "آپارات", sup: 6, dom: true, fmt: "ویدیو", fc: "۵۰ تا ۸۰ هزار", st: "۶۲٪ هدف", ver: "۹۰ ثانیه از خط نورد تا کارگاه؛ همکاری تبلیغاتی با فولاد سپیدار." },
    { n: "سایت‌ها", sup: 6, dom: true, fmt: "بنر", fc: "۲٬۴۰۰ تا ۳٬۳۰۰ ورود", st: "۶۵٪ هدف", ver: "میلگرد A4 با برگه‌ی آزمون هر محموله · استعلام قیمت" },
    { n: "اینستاگرام", sup: 8, dom: false, fmt: "ریلز", fc: "فقط برآورد", st: "برآورد", ver: "از کوره تا کارگاه در ۲۰ ثانیه." },
    { n: "تلگرام", sup: 10, dom: false, fmt: "پست", fc: "فقط برآورد", st: "برآورد", ver: "قیمت روز و برگه‌ی آزمون، در یک پیام. #تبلیغ" }
  ];
  const FLAGS = [["آهن ارزان امروز", "جهش ۴۰ هزار عضو در یک روز"], ["بازار داغ آهن", "۷۰٪ بازدید در ساعت اول، بعد صاف"], ["تخفیف مصالح", "بازدید یکسان برای همه‌ی پست‌ها"], ["آهن‌آلات فوری", "نسبت بازدید به عضو ۲٪"], ["میلگرد ارزان", "نظرهای تکراری و یکسان"], ["مصالح ویژه", "عضو زیاد، بازدید ناچیز"], ["قیمت لحظه‌ای ۲۴", "۷۰٪ بازدید در ساعت اول"]];
  const B = [0, 0], HUBR = .62;
  const mkPath = (pts) => { let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; } return { pts, seg, L }; };
  const at = (pa, u) => { let d = Math.max(0, Math.min(1, u)) * pa.L; for (let i = 0; i < pa.seg.length; i++) { if (d <= pa.seg[i] || i === pa.seg.length - 1) { const f = pa.seg[i] ? Math.min(1, d / pa.seg[i]) : 0, a = pa.pts[i], b = pa.pts[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; } d -= pa.seg[i]; } return pa.pts[pa.pts.length - 1]; };
  const H = CH.map((c, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / CH.length; return [Math.cos(a) * HUBR, Math.sin(a) * HUBR, a]; });
  let fi = 0;
  const SUP = CH.map((c, k) => { const a0 = H[k][2], out = []; for (let j = 0; j < c.sup; j++) { const a = a0 + (j / (c.sup - 1) - .5) * 0.95 + (rnd() - .5) * .06, r = HUBR + .12 + (j % 3) * .07 + rnd() * .03; const p = [Math.cos(a) * r, Math.sin(a) * r]; const flag = c.dom ? rnd() < .1 : rnd() < .16; const s = { k, p, flag, name: null, why: null, score: 0, q: rnd() < .72 ? "g" : "a" }; if (flag) { const f = FLAGS[fi++ % FLAGS.length]; s.name = f[0]; s.why = f[1]; s.score = 12 + Math.floor(rnd() * 30); } else s.score = 62 + Math.floor(rnd() * 35); s.out = mkPath([B, [H[k][0], H[k][1]], p]); s.in = mkPath([p, [H[k][0], H[k][1]], B]); out.push(s); } return out; });
  const ALLS = SUP.flat();
  const FAM = ["برنامه‌ریزی", "کیفیت رسانه", "استعلام", "محتوا", "انتشار", "پایش", "دستیار برند", "مالی و گزارش"].map((n, f) => { const a = -Math.PI / 2 + Math.PI / 8 + f * Math.PI / 4; return { n, p: [Math.cos(a) * .3, Math.sin(a) * .3] }; });
  const SALES = [0, .36];

  /* ================= state ================= */
  const LENS = ["intro", "quality", "forecast", "fleet", "studio", "watch", "proof", "answer", "end"];
  const ST = { lens: 0, mapA: 0, mapT: 0, scanned: false, scan: null, tg: 220, prob: .78, lag: false, recovered: false, cut: false, accent: [233, 182, 95], zoom: 1, zoomT: 1, ordered: false, joinUntil: 0, studioK: -1 };
  const ACC = () => ST.accent;
  let chips = [], timers = [], token = 0;

  /* ================= canvas, camera, projection ================= */
  const cv = $("#cv"), g = cv.getContext("2d");
  let W = 0, H2 = 0; const V = { cx: 0, cy: 0, R: 1 };
  const cam = { tilt: 1.0, rot: 0, mx: 0, my: 0 };
  function resize() {
    const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H2 = innerHeight; cv.width = W * d; cv.height = H2 * d; cv.style.width = W + "px"; cv.style.height = H2 + "px"; g.setTransform(d, 0, 0, d, 0, 0);
    if (W > 860) { const panelW = Math.min(420, W * .33) + 56, mw = W - panelW; V.cx = mw / 2 + 10; V.cy = H2 * .5 + 6; V.R = Math.min(mw * .43, H2 * .66); }
    else { V.cx = W / 2; V.cy = H2 * .29; V.R = Math.min(W * .36, H2 * .24); }
  }
  resize();
  function proj(x, y, z = 0) {
    const c = Math.cos(cam.rot), s = Math.sin(cam.rot), xr = x * c - y * s, yr = x * s + y * c, t = cam.tilt + cam.my * .06;
    const k = 3 / (3 - yr * Math.sin(t)), R = V.R * ST.zoom;
    return [V.cx + xr * R * k, V.cy + (yr * Math.cos(t) - z) * R * k, k];
  }

  /* ================= particles ================= */

    fleet: () => `${head(3, "ناوگان", "عامل‌های هوش مصنوعی")}<p class="line">صدها عامل کار عملیات را هم‌زمان انجام می‌دهند: استعلام از ادمین‌ها، پایش هر پست، خواندن مدرک‌ها و نوشتن گزارش. پول، انتشار و ادعا فقط با تأیید انسان.</p>${specs([["خانواده‌ها", "۸ گروه عامل، روی یک دفتر کل"], ["مدل‌ها", "متن‌باز، روی سرور خودمان"], ["مرز", "بدون حساب جعلی؛ فقط جایگاه واقعی"]])}<div class="ctrl nums"><div class="m"><b id="f1">۰</b><span>کار در یک کمپین</span></div><div><b id="f2">۰</b><span>تصمیم انسانی</span></div></div>${deep("fleet")}`,
    studio: () => `${head(4, "استودیو", "محتوای فارسی چندقالبی")}<p class="line">یک ایده برای هر بستر به قالب خودش تبدیل می‌شود: پست، ریلز، ویدیو، بنر. هر ادعا با واقعیت‌های تأییدشده‌ی برند سنجیده می‌شود.</p>${specs([["ایده", "«برگه‌ی آزمون برای هر محموله»"], ["پیش‌آزمون", "پنل شبیه‌سازی‌شده، سپس آزمون واقعی"], ["تولید رسانه", "روی GPU محلی"]])}<div class="ctrl"><div class="claim ok"><i>✓</i><span>«برگه‌ی آزمون کشش برای هر محموله»</span></div><div class="claim no"><i>✕</i><span>«مقاوم‌ترین میلگرد ایران»</span></div><div class="box" id="ver">روی یک بستر بزنید تا نسخه‌ی آن را ببینید.</div></div>${deep("studio")}`,
    watch: () => `${head(5, "دیده‌بان", "پایش زنده و بازیابی")}<p class="line">هر جایگاه زیر نظر است. وقتی بستری از بازه‌ی پیش‌بینی عقب بماند، جایگزین واقعی پیشنهاد می‌شود؛ در قطعی اینترنت، برنامه‌ی جایگزین امضاشده اجرا می‌شود.</p>${specs([["پایش", "۴۱ جایگاه، هر ۱۵ دقیقه"], ["بازیابی", "جایگزین با هزینه و مهلت لغو"], ["قطعی", "تداوم روی بسترهای داخلی"]])}<div class="ctrl"><div class="box alert" id="al"><b>ایتا پایین‌تر از بازه‌ی پیش‌بینی است</b><br>پیشنهاد: رزرو جایگزین در بله · ۱۳۰ م.ت · قابل لغو تا ۴۸ ساعت<br><button class="btn" id="ok">تأیید با یک کلیک</button></div><button class="switch ${ST.cut ? "on" : ""}" id="cut"><span>قطع اینترنت بین‌الملل</span><u></u></button></div>${deep("campaigns")}`,
    proof: () => `${head(6, "سند", "پرداخت در برابر مدرک")}<p class="line">هر عدد که از کانال‌ها برمی‌گردد درجه‌ی مدرک دارد. پول فقط برای مدرک پذیرفته به تأمین‌کننده برمی‌گردد و هر عدد گزارش منبعش را دارد.</p>${specs([["درجه‌ها", "A اتصال مستقیم · B خروجی ناشر · C اسکرین‌شات"], ["پرداخت", "فقط برای A و B"], ["کمبود", "جایگزین یا بازپرداخت، هرگز تعامل جعلی"]])}<div class="ctrl ledger" id="led"></div>${deep("finance")}`,
    answer: () => `${head(7, "پاسخ", "دستیار برند و استعلام")}<p class="line">به پرسش‌های فنی و قیمت مخاطبان، با نام و نشان خود برند جواب می‌دهد و استعلام‌ها را با نام پروژه به واحد فروش می‌فرستد.</p>${specs([["پاسخ", "فقط از واقعیت‌های تأییدشده"], ["خروجی", "استعلام با نام پروژه و استان"], ["شمارش", "پاسخ دستیار جزو تعامل مخاطب نیست"]])}<div class="ctrl"><div class="nums"><div class="m"><b id="a1">۰</b><span>پاسخ داده‌شده</span></div><div><b id="a2">۰</b><span>استعلام برای فروش</span></div></div><div class="ledger leads" id="leads"></div></div>${deep("evidence")}`,
    end: () => `<div class="kick">نسخه‌ی شما<span>هر هفت لنز، با نام شما</span></div><h1>داشبورد،<br><em>با برند شما.</em></h1><p class="line">همین نقشه و همه‌ی قابلیت‌ها، با نام و رنگ شما برای مشتری‌هایتان. برای شروع، ده روز با هم: پنج مشتری، سه پرونده‌ی کمپین قبلی، و یک نفر از عملیات شما.</p><input class="name" id="pname" placeholder="نام آژانس شما" aria-label="نام آژانس"><div class="sw" id="sw">${[[233, 182, 95], [92, 170, 230], [224, 100, 90], [111, 207, 151], [190, 140, 240]].map((c, i) => `<button data-c="${c.join(",")}" style="background:rgb(${c.join(",")})" class="${c.join(",") === ST.accent.join(",") ? "on" : ""}" aria-label="رنگ ${fa(i + 1)}"></button>`).join("")}</div><div class="brandx" id="bx">راوی <em>×</em> <span id="bxn">آژانس شما</span></div><button class="btn big" data-dash>ورود به داشبورد ←</button>`
  };

  /* ================= lens behaviour ================= */
  const later = (fn, ms, tk) => { const h = setTimeout(() => tk === token && fn(), reduce ? Math.min(ms, 50) : ms); timers.push(h); };
  const every = (fn, ms, tk) => { const h = setInterval(() => tk === token && fn(), ms); timers.push(h); };
  async function countUp(el, to, ms, tk) { if (!el) return; const n = 28; for (let k = 1; k <= n; k++) { if (tk !== token) return; el.textContent = nf(to * ease(k / n)); await new Promise((r) => setTimeout(r, reduce ? 0 : ms / n)); } }
  const RECEIPTS = [[0, "روبیکا · ۱۱۸٬۰۰۰ بازدید", "B"], [3, "آپارات · ۳۷٬۰۰۰ بازدید", "A"], [1, "ایتا · ۶۴٬۰۰۰ بازدید", "C"], [4, "سایت‌ها · ۷۴ استعلام", "A"], [0, "روبیکا · ۷۲٬۰۰۰ بازدید", "B"], [5, "اینستاگرام · ۲۱٬۰۰۰ پخش", "C"]];
  const LEADS = [["پروژه‌ی مسکونی ۱۲ طبقه", "اصفهان · ۸۰ تن"], ["انبوه‌ساز مجتمع اداری", "شیراز · ۲۲۰ تن"], ["پیمانکار پل شهری", "تبریز · ۱۴۰ تن"], ["بنکدار آهن‌آلات", "مشهد · ۳۰۰ تن"], ["پروژه‌ی بیمارستان", "اهواز · ۱۸۰ تن"]];
  const ENTER = {
    intro: (tk, replay) => { if (replay || !ST.ordered) { ST.mapT = 0; ST.scanned = false; ALLS.forEach((s) => (s.scanned = false)); P.forEach(noise); later(() => { ST.ordered = true; ST.mapT = 1; ST.joinUntil = performance.now() + 1500; reassign(true); }, 1600, tk); } else { ST.mapT = 1; reassign(true); } },
    quality: (tk) => { ST.scanned = false; ALLS.forEach((s) => (s.scanned = false)); reassign(true); let a = -Math.PI / 2; ST.scan = a; const start = performance.now(), dur = reduce ? 10 : 3600;
      every(() => { const u = Math.min(1, (performance.now() - start) / dur); a = -Math.PI / 2 + u * 6.283; ST.scan = a; ALLS.forEach((s) => { let sa = Math.atan2(s.p[1], s.p[0]); while (sa < -Math.PI / 2) sa += 6.283; if (sa <= a) s.scanned = true; });
        if (u >= 1 && ST.scan != null) { ST.scan = null; ST.scanned = true; countUp($("#q2"), 87, 900, tk); } }, 30, tk);
      countUp($("#q1"), 1200, dur, tk); },
    forecast: () => { reassign(true); const inp = $("#tg"); const upd = () => { ST.tg = +inp.value; ST.prob = Phi((248 - ST.tg) / 36); $("#tgv").textContent = fa(ST.tg) + " هزار"; $("#pv").textContent = fa(Math.round(ST.prob * 100)) + "٪"; }; inp.oninput = upd; upd(); },
    fleet: (tk) => { reassign(true); countUp($("#f1"), 18694, 2200, tk); countUp($("#f2"), 9, 2200, tk); },
    studio: (tk) => { reassign(true); let k = 0; const send = () => { const kk = k % CH.length, c = CH[kk]; if (!(ST.cut && !c.dom)) chip({ path: mkPath([B, [H[kk][0], H[kk][1]]]), label: c.fmt + " · " + c.n, sp: .42, bg: "#f2f5ec" }); k++; }; send(); every(send, 900, tk); },
    watch: (tk) => { ST.lag = false; ST.recovered = false; reassign(true);
      every(() => { CH.forEach((c, k) => { if (ST.cut && !c.dom) return; const lag = ST.lag && k === 1 && !ST.recovered; chip({ kind: "pulse", path: mkPath([[H[k][0], H[k][1]], B]), sp: lag ? .25 : .55, col: lag ? RED : !c.dom ? AMBER : MINT }); }); }, 1300, tk);
      later(() => { ST.lag = true; reassign(true); $("#al") && $("#al").classList.add("on"); }, 2200, tk);
      const ok = $("#ok"); ok.onclick = () => { ST.recovered = true; ok.disabled = true; ok.textContent = "تأیید شد ✓ · جایگزین بله فعال"; reassign(true); };
      const sw = $("#cut"); sw.onclick = () => { ST.cut = !ST.cut; sw.classList.toggle("on", ST.cut); reassign(true); }; },
    proof: (tk) => { reassign(true); let i = 0; const led = $("#led");
      const send = () => { const r = RECEIPTS[i++ % RECEIPTS.length], k = r[0]; if (ST.cut && !CH[k].dom) return;
        chip({ path: mkPath([[H[k][0], H[k][1]], B]), label: r[1] + " · " + r[2], sp: .3, bg: r[2] === "C" ? "#f3dfb9" : "#e3f3ee", done: () => {
          if (tk !== token) return; const ok = r[2] !== "C";
          if (ok) for (let j = 0; j < 3; j++) setTimeout(() => tk === token && chip({ kind: "coin", path: mkPath([B, [H[k][0], H[k][1]]]), sp: .55 }), j * 180);
          if (led) { led.insertAdjacentHTML("afterbegin", `<div class="g-${r[2]}"><em>${r[2]}</em><span>${r[1]}</span><small>${ok ? "پرداخت شد ✓" : "در بررسی · مدرک بهتر خواسته شد"}</small></div>`); while (led.children.length > 5) led.lastElementChild.remove(); } } }); };
      send(); every(send, 1500, tk); },
    answer: (tk) => { reassign(true); let n = 0, l = 0, li = 0; const leads = $("#leads");
      const ask = () => { const s = pickSup(pickChannel()); chip({ path: mkPath([s.p, B]), label: "؟", size: 13, sp: .4, bg: "rgba(255,255,255,.92)", done: () => { if (tk !== token) return; n++; $("#a1").textContent = nf(n * 4);
        if (n % 3 === 0) { const ld = LEADS[li++ % LEADS.length]; chip({ path: mkPath([B, SALES]), label: "استعلام · " + ld[1], sp: .22, bg: rgba(ACC(), 1), done: () => { if (tk !== token) return; l++; $("#a2").textContent = nf(l); if (leads) { leads.insertAdjacentHTML("afterbegin", `<div><b>${ld[0]}</b><span>${ld[1]} · ثبت با نام پروژه</span></div>`); while (leads.children.length > 3) leads.lastElementChild.remove(); } } }); } } }); };
      ask(); every(ask, 700, tk); },
    end: () => { reassign(true); const inp = $("#pname"); inp.oninput = () => { const v = inp.value.trim() || "آژانس شما"; $("#bxn").textContent = v; $("#logoName").textContent = inp.value.trim() ? "راوی × " + v : "راوی"; };
      $$("#sw button").forEach((b) => (b.onclick = () => { ST.accent = b.dataset.c.split(",").map(Number); $$("#sw button").forEach((x) => x.classList.toggle("on", x === b)); $("#lgAcc").style.background = `rgb(${b.dataset.c})`; reassign(true); })); }
  };

  /* ================= navigation ================= */
  const BAR = [["quality", "سنجه"], ["forecast", "پیش‌نما"], ["fleet", "ناوگان"], ["studio", "استودیو"], ["watch", "دیده‌بان"], ["proof", "سند"], ["answer", "پاسخ"]];
  $("#lenses").innerHTML = BAR.map((b, i) => `<button data-lens="${i + 1}" title="${fa(i + 1)}">${svg(b[0])}<span>${b[1]}</span></button>`).join("") + `<i class="sep"></i><button data-lens="8">${svg("end")}<span>نسخه‌ی شما</span></button>`;
  function go(i, replay) {
    i = Math.max(0, Math.min(LENS.length - 1, i)); if (i === ST.lens && !replay) return;
    token++; const tk = token; timers.forEach((h) => { clearTimeout(h); clearInterval(h); }); timers = []; chips = []; hideTip();
    const prev = LENS[ST.lens]; ST.lens = i; const L = LENS[i];
    if (prev === "watch" && L !== "watch") { ST.cut = false; ST.lag = false; ST.recovered = false; }
    if (L !== "quality") ST.scan = null;
    ST.zoomT = L === "end" ? 1.06 : 1; ST.studioK = -1;
    if (L !== "intro") { ST.mapT = 1; if (!ST.ordered) { ST.ordered = true; ST.joinUntil = performance.now() + 1200; } }
    const card = $("#card"); card.innerHTML = CARD[L](); [...card.children].forEach((c, k) => c.style.setProperty("--i", k)); card.scrollTop = 0;
    $$("#lenses button").forEach((b) => b.classList.toggle("on", +b.dataset.lens === i));
    const on = $("#lenses button.on"); if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
    history.replaceState(null, "", "#" + i);
    ENTER[L](tk, replay);
  }
  document.addEventListener("click", (e) => {
    const d = e.target.closest("[data-dash]"); if (d) { e.preventDefault(); toDashboard(); return; }
    const b = e.target.closest("[data-lens]"); if (b) { const i = +b.dataset.lens; go(i, i === 0 && ST.lens === 0); }
  });
  function toDashboard() { token++; timers.forEach((h) => { clearTimeout(h); clearInterval(h); }); ST.zoomT = 7; ST.mapT = 1; P.forEach((p) => { p.mode = "orbit"; p.oa = Math.random() * 6.283; p.or = Math.random() * .1; p.osp = 2; p.life = 1e9; }); $("#fade").style.opacity = 1; setTimeout(() => (location.href = "../ravi/index.html"), reduce ? 50 : 1100); }
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input")) return; if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key;
    if (k === "ArrowLeft" || k === "PageDown") { e.preventDefault(); go(ST.lens + 1); }
    else if (k === "ArrowRight" || k === "PageUp") { e.preventDefault(); go(ST.lens - 1); }
    else if (k === "Home" || k === "0" || k === "۰") go(0, ST.lens === 0);
    else if (k === "End" || k === "8" || k === "۸") go(8);
    else if (/^[1-7۱-۷]$/.test(k)) go("۰۱۲۳۴۵۶۷".includes(k) ? "۰۱۲۳۴۵۶۷".indexOf(k) : +k);
    else if (k.toLowerCase() === "f") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
  });

  /* ================= map interaction ================= */
  const tip = $("#tip"); let tipT;
  function showTip(x, y, html) { tip.innerHTML = html; tip.style.left = Math.min(W - 300, Math.max(10, x + 14)) + "px"; tip.style.top = Math.min(H2 - 140, Math.max(70, y - 20)) + "px"; tip.classList.add("on"); clearTimeout(tipT); tipT = setTimeout(hideTip, 4200); }
  function hideTip() { tip.classList.remove("on"); }
  cv.addEventListener("click", (e) => {
    if (ST.mapA < .5) return; const x = e.clientX, y = e.clientY, L = LENS[ST.lens];
    let best = null, bd = 18; ALLS.forEach((s) => { const q = proj(s.p[0], s.p[1]), d = Math.hypot(q[0] - x, q[1] - y); if (d < bd) { bd = d; best = { s }; } });
    CH.forEach((c, k) => { const q = proj(H[k][0], H[k][1]), d = Math.hypot(q[0] - x, q[1] - y); if (d < Math.max(bd, 22)) { bd = d; best = { k }; } });
    if (!best) { hideTip(); return; }
    if (best.k != null) { const c = CH[best.k];
      if (L === "studio") { ST.studioK = best.k; const v = $("#ver"); if (v) v.innerHTML = `<b>${c.fmt} · ${c.n}</b><br>${c.ver}`; return; }
      showTip(x, y, `<b>${c.n}</b><span class="m">${c.dom ? "بستر داخلی" : "فیلتر · دسترسی با فیلترشکن"}</span><br>پیش‌بینی: ${c.fc}<br>وضعیت: ${c.st}`); return; }
    const s = best.s, c = CH[s.k];
    if ((ST.scanned || s.scanned) && s.flag) showTip(x, y, `<b>«${s.name}»</b><span class="r">${c.n} · شاخص ${fa(s.score)} از ۱۰۰</span><br>${s.why}<br><span class="s">از برنامه خارج شد · بررسی انسانی، نه اتهام</span>`);
    else showTip(x, y, `<b>کانال ${c.n}</b>${ST.scanned || s.scanned ? `<span class="m">شاخص ${fa(s.score)} از ۱۰۰ · ${s.q === "g" ? "مدرک خوب" : "مدرک نامعلوم"}</span>` : "<span>هنوز سنجیده نشده</span>"}`);
  });
  cv.addEventListener("mousemove", (e) => { cam.mx = (e.clientX / W - .5); cam.my = (e.clientY / H2 - .5); });

  let live = 162; setInterval(() => { live = Math.max(140, Math.min(184, live + Math.round((Math.random() - .5) * 6))); $("#liveN").textContent = fa(live); }, 1400);

  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  const start = () => { requestAnimationFrame(frame); const m = /#(\d)/.exec(location.hash); ST.lens = -1; go(m ? +m[1] : 0); };
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load("900 14px Vazirmatn"), document.fonts.load("700 12px Vazirmatn")]).catch(() => {}) : Promise.resolve()).then(start);
})();
</script>
</body>
