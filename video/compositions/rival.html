      const N = 31, W = 840, H = 340;
      const you = [], ra = [], rb = [];
      for (let i = 0; i < N; i++) {
        you.push(0.22 + 0.16 * (i / N) + 0.05 * Math.sin(i * 0.7) + (i > 24 ? 0.06 : 0));
        ra.push(0.34 - 0.06 * (i / N) + 0.05 * Math.cos(i * 0.5));
        rb.push(0.24 + 0.04 * Math.sin(i * 0.9 + 1));
      }
      const x = (i) => (i / (N - 1)) * W;
      const area = (lo, hi) => {
        let d = "M" + x(0) + " " + (H - hi[0] * H);
        for (let i = 1; i < N; i++) d += " L" + x(i).toFixed(1) + " " + (H - hi[i] * H).toFixed(1);
        for (let i = N - 1; i >= 0; i--) d += " L" + x(i).toFixed(1) + " " + (H - lo[i] * H).toFixed(1);
        return d + "Z";
      };
      const z = new Array(N).fill(0);
      const s1 = you.map((v) => v), s2 = you.map((v, i) => v + rb[i]), s3 = you.map((v, i) => v + rb[i] + ra[i]);
      const norm = (a) => a.map((v, i) => v / s3[i]);
      const layers = document.getElementById("rv-layers");
      [[z, norm(s1), "#E39B2D"], [norm(s1), norm(s2), "#8C3D5E"], [norm(s2), norm(s3), "#3D6B8C"]].forEach(([lo, hi, c]) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", area(lo, hi)); p.setAttribute("fill", c); p.setAttribute("stroke", "#fff"); p.setAttribute("stroke-width", "2");
        layers.appendChild(p);
      });
      const axes = ["آلودگی هوا", "حمل‌ونقل", "مسکن", "اشتغال جوانان", "فضای سبز"];
      const sp = document.getElementById("rv-spider");
      const R = 150, ang = (k) => -Math.PI / 2 + (k * 2 * Math.PI) / 5;
      let grid = "";
      [0.33, 0.66, 1].forEach((f) => { grid += '<polygon points="' + axes.map((_, k) => (Math.cos(ang(k)) * R * f).toFixed(1) + "," + (Math.sin(ang(k)) * R * f).toFixed(1)).join(" ") + '" fill="none" stroke="#E7E2D7" stroke-width="2"/>'; });
      axes.forEach((a, k) => {
        const lx = Math.cos(ang(k)) * (R + 40), ly = Math.sin(ang(k)) * (R + 40);
        grid += '<line x1="0" y1="0" x2="' + (Math.cos(ang(k)) * R).toFixed(1) + '" y2="' + (Math.sin(ang(k)) * R).toFixed(1) + '" stroke="#E7E2D7" stroke-width="2"/>';

      });

      const poly = (v) => v.map((f, k) => (Math.cos(ang(k)) * R * f).toFixed(1) + "," + (Math.sin(ang(k)) * R * f).toFixed(1)).join(" ");
      grid += '<polygon class="rv-poly" points="' + poly(vals.a) + '" fill="rgba(61,107,140,.18)" stroke="#3D6B8C" stroke-width="4"/>';
      grid += '<polygon class="rv-poly" points="' + poly(vals.b) + '" fill="rgba(140,61,94,.16)" stroke="#8C3D5E" stroke-width="4"/>';
      grid += '<polygon class="rv-poly" points="' + poly(vals.you) + '" fill="rgba(227,155,45,.25)" stroke="#E39B2D" stroke-width="5"/>';
      sp.innerHTML = grid;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#rv-cliprect", { attr: { width: 0 } }, { attr: { width: 860 }, duration: 2.2, ease: "power2.inOut" }, 0.8);
      tl.fromTo("#rv-own", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.7);
      tl.fromTo(".rv-poly", { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.9, stagger: 0.5, ease: "expo.out" }, 3.2);
      ["#rv-k1", "#rv-k2", "#rv-k3"].forEach((k, i) => tl.fromTo(k, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 4.8 + i * 0.5));
