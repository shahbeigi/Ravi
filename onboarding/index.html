<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b3032" />
<title>سفر راوی</title>
<meta name="description" content="سفر یک کمپین در راوی: از یک پیام برند تا عدد قابل اثبات، با صدها عامل هوش مصنوعی و تصمیم‌های انسانی." />
<style>
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Vazirmatn";src:url("../ravi/fonts/vazirmatn-900.woff2") format("woff2");font-weight:900}
:root{--t950:#072628;--t900:#0b3032;--t800:#123f41;--sig:#e9b65f;--sig-hi:#ffd98e;--mint:#7fc8b6;--red:#f19b8c;--ink:#e8efea;--ink2:#a9c2bb;--glass:rgba(255,255,255,.055);--gl:rgba(255,255,255,.11)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:#062224}
body{background:radial-gradient(ellipse at 30% 45%,#174a4b 0,#0b3032 48%,#062224 100%);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
::selection{background:var(--sig);color:var(--t900)}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}
.shell{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:62px minmax(0,1fr) auto}
/* hud */
.hud{display:flex;align-items:center;gap:16px;padding:0 26px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo{font-weight:900;font-size:24px;display:flex;align-items:center;gap:8px}.logo i{width:9px;height:9px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 5px rgba(233,182,95,.14)}
#chap{color:var(--ink2);font-size:13.5px;font-weight:700}
.grow{flex:1}
.counter{display:flex;gap:18px;align-items:center;font-size:12.5px;color:var(--ink2);opacity:0;transition:opacity .6s}
.counter.on{opacity:1}
.counter b{font-size:20px;font-weight:900;color:var(--mint);margin-inline-end:5px}.counter .hb b{color:var(--sig)}
.simtag{font-size:11.5px;font-weight:700;color:var(--sig-hi);border:1px solid rgba(233,182,95,.35);padding:3px 10px;border-radius:9px;opacity:0;transition:opacity .4s}
.simtag.on{opacity:1}
.hbtn{padding:6px 11px;border-radius:10px;border:1px solid var(--gl);font-size:12.5px;font-weight:700;color:var(--ink2)}
.hbtn.on{background:rgba(255,255,255,.08);color:var(--ink)}
/* body */
.body{display:grid;grid-template-columns:minmax(380px,43%) minmax(0,1fr);gap:28px;padding:6px 34px 0;min-height:0}
#panel{align-self:center;max-height:100%;overflow-y:auto;padding:12px 4px 12px 10px;scrollbar-width:thin;scrollbar-color:#2f5d5c transparent}
#panel>*{animation:up .7s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
#art{position:relative;min-height:0;margin:14px 0}
#artov{position:absolute;inset:0}
/* typography */
.kick{display:flex;align-items:center;gap:10px;color:var(--sig);font-size:13px;font-weight:700}
.kick:before{content:"";width:24px;height:2px;background:var(--sig)}
h1{font-size:clamp(34px,4.4vw,60px);font-weight:900;line-height:1.25;margin:14px 0 16px}
h1 em,h2 em{font-style:normal;color:var(--sig)}
h2{font-size:clamp(24px,2.6vw,36px);font-weight:900;line-height:1.4;margin:10px 0 14px}
.lead{font-size:17px;line-height:1.9;color:#bcd2cb;margin:0 0 16px}
.note{font-size:12.5px;color:var(--ink2);line-height:1.8;border-inline-start:2px solid rgba(233,182,95,.5);padding-inline-start:10px;margin-top:12px}
.human{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 12px;border-radius:10px;background:rgba(233,182,95,.13);color:var(--sig-hi);font-size:13px;font-weight:700}
.human:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 4px rgba(233,182,95,.2)}
.glass{background:var(--glass);border:1px solid var(--gl);border-radius:18px;padding:14px 16px;backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:13px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--gl);text-decoration:none}
.btn.sig{background:var(--sig);color:var(--t900);border-color:var(--sig);box-shadow:0 10px 30px rgba(233,182,95,.25)}
.hint{font-size:12px;color:var(--ink2)}
.rv{opacity:.12;transform:translateY(6px);transition:opacity .6s,transform .6s}.rv.on{opacity:1;transform:none}
/* station header */
.st{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2);font-weight:700}
.segs{display:flex;gap:4px;direction:rtl}.segs i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}.segs i.d{background:var(--mint)}.segs i.c{background:var(--sig)}
/* numbers */
.nums{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 10px}
.nums div b{display:block;font-size:34px;font-weight:900;color:var(--sig-hi);line-height:1.2}
.nums div span{font-size:12.5px;color:var(--ink2)}
.nums .m b{color:var(--mint)}.nums .r b{color:var(--red)}
/* chat */
.chat .who{font-size:12.5px;color:var(--ink2);margin-bottom:6px}.chat .who small{color:var(--sig)}
.bubble{background:#f2f5ec;color:#132a2b;border-radius:20px 20px 20px 5px;padding:14px 18px;font-size:17px;line-height:1.9;min-height:96px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
/* facts */
.facts{display:grid;gap:10px}
.facts .f{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.facts .f b{font-size:24px;font-weight:900;color:var(--sig-hi);line-height:1.3}
.facts .f.red b{color:var(--red)}
.facts .f p{margin:0;font-size:14.5px;line-height:1.75}
.facts .f small{display:block;font-size:11.5px;color:var(--ink2)}
/* morph */
.morph{display:grid;gap:7px}
.morph div{display:grid;grid-template-columns:1fr 28px 1.25fr;align-items:center;gap:8px;font-size:14.5px}
.morph s{color:var(--ink2);text-decoration:none;opacity:.75}
.morph i{color:var(--sig);font-style:normal;text-align:center}
.morph b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips span{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid rgba(233,182,95,.4);color:var(--sig-hi);background:rgba(233,182,95,.07)}
.chips.q span{border-color:rgba(127,200,182,.4);color:var(--mint);background:rgba(127,200,182,.07)}
/* brief card */
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--ink2);font-weight:700}.kv dd{margin:0}
/* lists */
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.clean li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.75}
ul.clean li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);margin-top:9px;flex:none}
.trend{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14.5px}
.trend b{color:var(--mint)}
.ticker{display:grid;gap:6px;max-height:186px;overflow:hidden}
.ticker div{font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.05);animation:up .45s both}
.ticker div em{font-style:normal;color:var(--mint);font-weight:700}
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{padding:8px 14px;border-radius:11px;border:1px solid var(--gl);font-size:13.5px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--sig);color:var(--t900);border-color:var(--sig)}
.prob{display:flex;align-items:baseline;gap:12px}.prob b{font-size:54px;font-weight:900;color:var(--sig-hi);line-height:1}
.alert{border:1px solid rgba(241,155,140,.5);background:rgba(241,155,140,.08);border-radius:16px;padding:12px 14px;margin-top:10px;display:none}
.alert.on{display:block;animation:up .5s both}
.alert b{color:var(--red)}
.prod{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.prod span{width:28px;height:28px;border-radius:9px;background:var(--sig);color:var(--t900);display:grid;place-items:center;font-weight:900;font-size:13px}
.prod b{display:block;font-size:15px}.prod small{color:var(--ink2);font-size:12.5px}
.models{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.models div{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--ink2);line-height:1.6}
.models b{display:block;color:var(--ink);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two h4{margin:0 0 6px;font-size:14px;color:var(--mint)}.two .no h4{color:var(--red)}
.meter{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.meter u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sig));border-radius:6px;transition:width 1.6s cubic-bezier(.22,1,.36,1)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
.big2 div{padding:16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--gl)}
.big2 b{display:block;font-size:46px;font-weight:900;line-height:1.15;color:var(--mint)}.big2 .h b{color:var(--sig-hi)}
.big2 span{font-size:13px;color:var(--ink2)}
/* art labels */
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;font-weight:700;color:#dfeae5;background:rgba(7,38,40,.72);padding:3px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.08);transition:opacity .5s}
.lbl.big{font-size:clamp(18px,2vw,26px);font-weight:900;background:none;border:0;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.lbl.sig{color:var(--t900);background:var(--sig);border-color:var(--sig)}
.lbl.red{color:var(--red)}
.lbl.off{opacity:0}
.hub{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd98e,#e9b65f);color:#10383a;display:grid;place-items:center;text-align:center;font-weight:900;font-size:13.5px;line-height:1.35;box-shadow:0 0 0 12px rgba(233,182,95,.08),0 0 60px rgba(233,182,95,.35);animation:hp 2.6s ease-in-out infinite}
.hub.sm{width:72px;height:72px;font-size:12px}
.hub.mint{background:radial-gradient(circle at 35% 30%,#bfe8dc,#7fc8b6);box-shadow:0 0 0 12px rgba(127,200,182,.08),0 0 50px rgba(127,200,182,.3)}
@keyframes hp{50%{box-shadow:0 0 0 20px rgba(233,182,95,.04),0 0 80px rgba(233,182,95,.45)}}
.vline{position:absolute;top:4%;bottom:8%;width:0;border-inline-start:2px dashed var(--sig)}
.vline span{position:absolute;top:-4px;transform:translateX(50%);right:0;white-space:nowrap;font-size:12px;font-weight:900;color:var(--t900);background:var(--sig);padding:2px 9px;border-radius:8px}
.axis{position:absolute;bottom:2%;font-size:11.5px;color:var(--ink2);transform:translateX(-50%)}
.vgrid{position:absolute;left:5%;right:5%;top:4%;height:38%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(3,1fr);gap:7px}
.vgrid div{border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--ink2);display:grid;place-items:center;text-align:center;line-height:1.4;opacity:0;transform:scale(.7);transition:all .45s cubic-bezier(.22,1,.36,1)}
.vgrid div.on{opacity:1;transform:none}
.vgrid div.win{background:var(--sig);color:var(--t900);font-weight:900;border-color:var(--sig);box-shadow:0 0 30px rgba(233,182,95,.45)}
.vgrid div.bad{background:rgba(241,155,140,.18);border-color:var(--red);color:var(--red);font-weight:700}
.scan{position:absolute;top:2%;bottom:2%;width:3px;background:var(--sig);box-shadow:0 0 22px 4px rgba(233,182,95,.55);opacity:0}
.divide{position:absolute;left:50%;top:6%;bottom:6%;border-left:1px dashed rgba(255,255,255,.18)}
svg.chart{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.chart path{fill:none;vector-effect:non-scaling-stroke}
.tl{position:absolute;height:2px;background:linear-gradient(270deg,var(--sig),rgba(255,255,255,.15) 18%);left:6%;right:6%;top:45%}
.ms{position:absolute;transform:translate(-50%,0);top:calc(45% + 18px);text-align:center;font-size:12.5px;width:140px;color:var(--ink2)}
.ms b{display:block;color:var(--ink);font-size:13.5px}
.ms.now b{color:var(--sig-hi)}
.ms:before{content:"";position:absolute;top:-25px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#2f5d5c;border:2px solid #0b3032}
.ms.now:before{background:var(--sig);box-shadow:0 0 0 6px rgba(233,182,95,.2)}
/* footer */
.foot{padding:8px 26px 16px;display:grid;gap:10px}
.cap{min-height:58px;max-width:1060px;margin:0 auto;text-align:center;font-size:clamp(14.5px,1.25vw,18px);line-height:1.85;color:#d9e6e0;transition:opacity .3s}
.cap span{opacity:0;animation:w .5s forwards}
@keyframes w{to{opacity:1}}
body.nocap .cap{opacity:0}
.ctl{display:flex;align-items:center;gap:10px;justify-content:center}
.ctl button.cb{width:40px;height:40px;border-radius:12px;border:1px solid var(--gl);display:grid;place-items:center;font-size:15px}
.ctl button.play{width:auto;padding:0 16px;background:var(--sig);color:var(--t900);border-color:var(--sig);font-weight:900}
.prog{display:flex;gap:4px;flex:1;max-width:820px;direction:rtl}
.prog button{flex:1;height:14px;display:grid;align-items:center;padding:0}
.prog button i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .3s}
.prog button.d i{background:var(--mint)}.prog button.c i{background:var(--sig);height:6px}
.prog button.gap{margin-inline-start:8px}
@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .segs{display:none}
  .shell{position:relative;min-height:100%;grid-template-rows:56px auto auto}
  .body{grid-template-columns:1fr;grid-template-rows:42vh auto;padding:0 16px}
  #art{order:-1;margin:8px 0}
  #panel{max-height:none;overflow:visible}
  .hud{padding:0 14px;gap:10px}.hud #chap,.simtag,.hbtn.fs{display:none}
  .counter b{font-size:16px}
  .foot{padding:14px 12px 16px}
  .cap{font-size:14px;min-height:0}
  .facts .f{grid-template-columns:110px 1fr}
  .two,.models,.big2{grid-template-columns:1fr}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cap span{opacity:1}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div class="shell">
  <header class="hud">
    <div class="logo"><i></i>راوی</div>
    <span id="chap"></span>
    <span class="grow"></span>
    <span class="simtag" id="sim">شبیه‌سازی نمایشی · اعداد نمونه</span>
    <div class="counter" id="ctr"><span><b id="cT">۰</b>کار عامل‌ها</span><span class="hb"><b id="cH">۰</b>تصمیم انسانی</span></div>
    <button class="hbtn on" id="capBtn" title="زیرنویس (C)">زیرنویس</button>
    <button class="hbtn fs" id="fsBtn" title="تمام صفحه (F)">تمام‌صفحه</button>
  </header>
  <div class="body">
    <main id="panel" aria-live="polite"></main>
    <div id="art"><div id="artov"></div></div>
  </div>
  <footer class="foot">
    <div class="cap" id="cap"></div>
    <div class="ctl">
      <button class="cb" id="prev" aria-label="صحنه‌ی قبل">→</button>
      <button class="cb play" id="play" aria-label="پخش خودکار">▶ پخش</button>
      <button class="cb" id="next" aria-label="صحنه‌ی بعد">←</button>
      <div class="prog" id="prog"></div>
    </div>
  </footer>
</div>
<noscript>برای دیدن این سفر، جاوااسکریپت را فعال کنید.</noscript>
<script>
(() => {
  "use strict";
  /* ================= utilities ================= */
  const $ = (s, e = document) => e.querySelector(s);
  const $$ = (s, e = document) => [...e.querySelectorAll(s)];
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const nf = (n) => fa(Math.round(n).toLocaleString("en-US")).replace(/,/g, "٬");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seed = 1; const rs = (n) => (seed = n); const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const Phi = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
  const ease = (u) => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const MINT = [127, 200, 182], SIG = [233, 182, 95], RED = [241, 120, 100], DIM = [70, 112, 108], WHITE = [226, 236, 232], GREY = [80, 92, 92], AMBER = [214, 160, 80], TEAL = [80, 140, 128];

  /* ================= canvas + particles ================= */
  const cv = $("#cv"), g = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cv.style.width = W + "px"; cv.style.height = H + "px"; g.setTransform(d, 0, 0, d, 0, 0); }
  resize();
  const N = innerWidth < 900 ? 480 : 640;
  const P = Array.from({ length: N }, () => ({ x: Math.random() * W, y: Math.random() * H, tx: 0, ty: 0, r: 1.2, tr: 1.2, c: [...DIM], tc: DIM, a: 0, ta: .14, s: .02, j: 8, ph: Math.random() * 6.283, fn: null, d: 0 }));
  let links = [];
  function T(p, o) { if (o.x != null) p.tx = o.x; if (o.y != null) p.ty = o.y; if (o.c) p.tc = o.c; if (o.a != null) p.ta = o.a; if (o.r != null) p.tr = o.r; p.s = reduce ? 1 : (o.s || .07); p.j = reduce ? 0 : (o.j || 0); p.fn = o.fn || null; p.d = reduce ? 0 : (o.d || 0); }
  function ambient(p) { T(p, { x: Math.random() * W, y: Math.random() * H, c: DIM, a: .13, r: 1.2, s: .012, j: 10 }); }
  const art = () => { const r = $("#art").getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2, X: (f) => r.left + f * r.width, Y: (f) => r.top + f * r.height }; };
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(48, t - last); last = t;
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "source-over";
    for (const L of links) {
      const x2 = L.i != null ? P[L.i].x : L.x2, y2 = L.i != null ? P[L.i].y : L.y2;
      g.strokeStyle = `rgba(${L.c || "127,200,182"},${L.a || .12})`; g.lineWidth = 1; g.beginPath(); g.moveTo(L.x1, L.y1); g.lineTo(x2, y2); g.stroke();
    }
    g.globalCompositeOperation = "lighter";
    for (const p of P) {
      if (p.d > 0) p.d -= dt;
      else {
        let tx = p.tx, ty = p.ty;

    panel: `<div class="kick">۷ · برای شما</div><h2>شش چیز تازه برای فروش،<br><em>نه فقط جایگاه تبلیغ.</em></h2>${PROD.map((p, k) => `<div class="prod rv"><span>${fa(k + 1)}</span><div><b>${p[0]}</b><small>${p[1]}</small></div></div>`).join("")}<div class="glass rv hr" style="margin-top:12px;font-size:14px">ساعت اپراتور برای هر کمپین: حدود <b>۸۰</b> ← هدف <b style="color:#ffd98e">۳۰</b><div class="note" style="margin-top:6px">فرضیه؛ در پایلوت با ثبت ساعت واقعی سنجیده می‌شود.</div></div>`,
    art: `<div class="hub" style="left:50%;top:50%;width:120px;height:120px;font-size:18px">شما</div>` + PROD.map((p, k) => { const a = -Math.PI / 2 + k * Math.PI / 3; return lbl(.5 + .38 * Math.cos(a), .5 + .4 * Math.sin(a), p[0], "off pl"); }).join(""),
    narr: "برای شما این یعنی شش چیز تازه برای فروش، نه فقط جایگاه تبلیغ. و یعنی هر نفر از تیم عملیات شما کمپین‌های بیشتری را می‌گرداند؛ این را در پایلوت با ساعت واقعی می‌سنجیم. داشبورد می‌تواند با نام و نشان شما به مشتری‌هایتان برسد.",
    layout(A) { rs(17); this.sat = PROD.map((_, k) => { const a = -Math.PI / 2 + k * Math.PI / 3; return [A.X(.5 + .38 * Math.cos(a)), A.Y(.5 + .4 * Math.sin(a))]; }); this.c = [A.cx, A.cy];
      P.forEach((p, i) => { if (i < 360) { const k = i % 6; T(p, { x: this.sat[k][0] + gauss() * 10, y: this.sat[k][1] + gauss() * 10, c: DIM, a: .2, r: 1.6, s: .05 }); } else ambient(p); }); },
    async run(tk) { const c = this.c; for (let k = 0; k < 6; k++) { $$(".prod")[k].classList.add("on"); $$(".lbl.pl")[k].classList.remove("off"); const [sx, sy] = this.sat[k];
        for (let j = 0; j < 60; j++) { const p = P[k + j * 6]; const sp = .00025 + rnd() * .00015, ph = rnd(), w = gauss() * 8; T(p, { c: k % 2 ? MINT : SIG, a: .9, r: 2, s: .25, fn: (t) => { const u = ease((t * sp + ph) % 1); return [sx + (c[0] - sx) * u + w, sy + (c[1] - sy) * u - w]; } }); }
        await wait(700, tk); } $(".hr").classList.add("on"); }
  });

  /* 8 · How close */
  const MS = [[.9, "امروز", "پژوهش، معماری، داشبورد، این سفر", "now"], [.71, "۱۰ روز", "اسپرینت میدانی با شما"], [.52, "۴ هفته", "ابزار پایلوت مدیریت‌شده"], [.32, "۴ تا ۶ هفته", "MVP متصل به ۲ تا ۳ بستر"], [.12, "پس از داده", "پیش‌بینی و بهینه‌سازی"]];
  S.push({ ch: "چقدر نزدیکیم", dur: 13000,
    panel: `<div class="kick">۸ · چقدر نزدیکیم</div><h2>نرم‌افزار آماده‌ی ساخت است؛<br><em>مجهول‌ها بیرون از کدند.</em></h2><div class="two"><div class="glass rv"><h4>آماده</h4><ul class="clean"><li>پژوهش بازار با منبع</li><li>معماری و مدل داده</li><li>داشبورد کلیک‌پذیر</li><li>همین سفر و فیلمنامه‌ی ارائه</li></ul></div><div class="glass rv no"><h4>هنوز نمی‌دانیم</h4><ul class="clean"><li>قیمت واقعی تأمین‌کنندگان</li><li>کیفیت مدرک‌شان</li><li>تمایل مشتری به پرداخت برای «اثبات»</li><li>دسترسی API هر بستر</li></ul></div></div><div class="glass rv" style="margin-top:10px"><div class="row" style="justify-content:space-between;font-size:13.5px"><span>نزدیکی به خواسته‌ی مشتری</span><b style="color:#ffd98e">۴۸٪</b></div><div class="meter"><u id="mt"></u></div><div class="note" style="margin-top:8px">قضاوت تیم، نه اندازه‌گیری. جزئیات در اتاق تصمیم.</div></div>`,
    art: `<div class="tl"></div>` + MS.map((m) => `<div class="ms ${m[3] || ""}" style="left:${m[0] * 100}%"><b>${m[1]}</b>${m[2]}</div>`).join(""),
    narr: "امروز پژوهش، معماری و نمونه‌ی کلیک‌پذیر آماده است. چیزی که نداریم بیرون از کد است: قیمت واقعی تأمین‌کنندگان، کیفیت مدرک‌شان، و اینکه مشتری‌های شما برای «اثبات» حاضرند بیشتر بپردازند یا نه. این‌ها را در ده روز با هم می‌فهمیم.",
    layout(A) { rs(88); P.forEach((p, i) => { if (i < 300) { const f = .06 + .88 * (i / 299); const done = f >= .88; T(p, { x: A.X(f), y: A.Y(.45) + gauss() * (done ? 6 : 3), c: done ? SIG : DIM, a: done ? 1 : .35, r: done ? 2.6 : 1.4, s: .06, d: (1 - f) * 900 }); } else ambient(p); }); },
    async run(tk) { await wait(500, tk); await reveal(".two .rv, .glass.rv", 500, tk); $("#mt").style.width = "48%"; }
  });

  /* 9 · Ask */
  S.push({ ch: "شروع", dur: 20000,
    panel: `<div class="kick">۹ · شروع</div><h2>ده روز،<br><em>با هم.</em></h2><div class="prod rv"><span>۱</span><div><b>۵ مشتری برای گفت‌وگو</b><small>برندهایی که همین حالا هدف بازدید دارند</small></div></div><div class="prod rv"><span>۲</span><div><b>۳ پرونده‌ی کمپین قبلی، بدون نام</b><small>بریف، برنامه، فاکتور و گزارش</small></div></div><div class="prod rv"><span>۳</span><div><b>یک نفر از عملیات شما</b><small>کسی که کمپین را واقعاً اجرا می‌کند</small></div></div><p class="lead rv" style="margin-top:12px">خروجی ده روز: یک پیشنهاد پایلوت قیمت‌گذاری‌شده، با معیار روشن برای ادامه یا توقف.</p><div class="row rv"><a class="btn sig" href="../ravi/index.html">ورود به داشبورد ←</a><a class="btn" href="../decision-room/index.html">اتاق تصمیم</a><button class="btn" data-restart>از اول</button></div>`,
    narr: "پیشنهاد ما ساده است: ده روز. پنج مشتری برای گفت‌وگو، سه پرونده‌ی کمپین قبلی بدون نام، و یک نفر از عملیات شما. در پایان ده روز، یک پیشنهاد پایلوت قیمت‌گذاری‌شده روی میز است، با معیارهای روشن برای ادامه یا توقف.",
    layout(A) { const pts = textPts("۱۰ روز", A.cx, A.cy, Math.min(A.w * .26, A.h * .42), N - 40); P.forEach((p, i) => { if (i < pts.length) T(p, { x: pts[i][0], y: pts[i][1], c: i % 5 === 0 ? MINT : SIG, a: .95, r: 2.2, s: .045, j: 1.2, d: i * 2 }); else ambient(p); }); },
    async run(tk) { await wait(600, tk); await reveal("#panel .rv", 450, tk); }
  });

  /* ================= navigation ================= */
  const JSTART = S.findIndex((s) => s.add);
  const prog = $("#prog");
  prog.innerHTML = S.map((s, i) => `<button title="${s.ch}" data-i="${i}" class="${i === 1 || i === 2 || i === 3 || i === JSTART || s.ch === "موتور" || s.ch === "خط قرمز" || s.ch === "برای شما" || s.ch === "چقدر نزدیکیم" || s.ch === "شروع" ? "gap" : ""}"><i></i></button>`).join("");
  $$("#prog button").forEach((b) => (b.onclick = () => go(+b.dataset.i)));
  let shownT = 0, shownH = 0;
  async function hud(i) {
    $("#chap").textContent = S[i].ch; $("#sim").classList.toggle("on", !!S[i].sim);
    $("#ctr").classList.toggle("on", i >= JSTART);
    let t = 0, h = 0; for (let k = 0; k <= i; k++) if (S[k].add) { t += S[k].add[0]; h += S[k].add[1]; }
    const t0 = shownT, h0 = shownH; shownT = t; shownH = h; const n = 20;
    for (let k = 1; k <= n; k++) { const e = ease(k / n); $("#cT").textContent = nf(t0 + (t - t0) * e); $("#cH").textContent = nf(h0 + (h - h0) * e); await new Promise((r) => setTimeout(r, reduce ? 0 : 40)); }
  }
  function caption(txt) { const c = $("#cap"); c.innerHTML = txt.split(" ").map((w, k) => `<span style="animation-delay:${Math.min(k * 55, 2600)}ms">${w}</span>`).join(" "); }
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i)); idx = i; token++; const tk = token; clearTimeout(autoT); links = [];
    const sc = S[i]; const pn = $("#panel"); pn.innerHTML = sc.panel; [...pn.children].forEach((c, k) => c.style.setProperty("--i", k)); pn.scrollTop = 0;
    $("#artov").innerHTML = sc.art || "";
    caption(sc.narr); hud(i);
    $$("#prog button").forEach((b, k) => { b.classList.toggle("d", k < i); b.classList.toggle("c", k === i); });
    history.replaceState(null, "", "#s" + (i + 1));
    requestAnimationFrame(() => { sc.layout(art(), true); if (sc.run) sc.run(tk).catch(() => {}); });
    $$("[data-next]").forEach((b) => (b.onclick = () => go(idx + 1)));
    $$("[data-restart]").forEach((b) => (b.onclick = () => { setPlay(false); shownT = shownH = 0; go(0); }));
    if (playing) autoT = setTimeout(() => { if (tk === token) { if (idx < S.length - 1) go(idx + 1); else setPlay(false); } }, sc.dur);
  }
  function setPlay(on) { playing = on; $("#play").textContent = on ? "❚❚ توقف" : "▶ پخش"; clearTimeout(autoT); if (on) { const tk = token; autoT = setTimeout(() => { if (tk === token && idx < S.length - 1) go(idx + 1); }, Math.max(2500, S[idx].dur - 4000)); } }
  $("#next").onclick = () => go(idx + 1);
  $("#prev").onclick = () => go(idx - 1);
  $("#play").onclick = () => setPlay(!playing);
  $("#capBtn").onclick = () => { document.body.classList.toggle("nocap"); $("#capBtn").classList.toggle("on"); };
  $("#fsBtn").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
  addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea")) return;
    if (e.key === "ArrowLeft" || e.key === "PageDown") { e.preventDefault(); go(idx + 1); }
    else if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
    else if (e.key === " ") { e.preventDefault(); setPlay(!playing); }
    else if (e.key.toLowerCase() === "c") $("#capBtn").click();
    else if (e.key.toLowerCase() === "f") $("#fsBtn").click();
  });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { resize(); links = []; S[idx].layout(art(), false); }, 200); });
  const start = () => { const m = /#s(\d+)/.exec(location.hash); go(m ? +m[1] - 1 : 0); if (/autoplay/.test(location.search)) setPlay(true); };
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load("900 80px Vazirmatn"), document.fonts.load("700 14px Vazirmatn")]).catch(() => {}) : Promise.resolve()).then(start);
})();
</script>
