<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#10383a" />
<title>راوی</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("ravi/fonts/vazirmatn-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Vazirmatn";src:url("ravi/fonts/vazirmatn-900.woff2") format("woff2");font-weight:900}
:root{--sig:#e9b65f;--ink:#e8efea;--ink2:#a9c2bb}
*{box-sizing:border-box}
html{background:#062224}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 30% 30%,#174a4b 0,#0b3032 50%,#062224 100%);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif}
main{width:100%;max-width:880px}
h1{font-size:clamp(40px,7vw,64px);font-weight:900;margin:0;display:flex;align-items:center;gap:12px}
h1 i{width:12px;height:12px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 7px rgba(233,182,95,.15)}
p{color:var(--ink2);font-size:17px;line-height:1.9;margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
a{display:block;padding:20px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:inherit;text-decoration:none;transition:transform .25s,border-color .25s}
a:hover,a:focus-visible{transform:translateY(-3px);border-color:var(--sig);outline:none}
a b{display:block;font-size:20px;font-weight:900;margin-bottom:6px}
a span{font-size:14px;color:var(--ink2);line-height:1.8}
a.main{background:var(--sig);border-color:var(--sig);color:#10383a}
a.main span{color:#3d4a3f}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1><i></i>راوی</h1>
  <p>پلتفرم عملیات کمپین برای برندها؛ نسخه‌ی نمایشی با داده‌های سناریویی.</p>
  <div class="grid">
    <a class="main" href="ravi/index.html"><b>داشبورد</b><span>چرخه‌ی کمپین، ناوگان عامل‌ها، رادار بازار، کیفیت رسانه</span></a>
    <a href="onboarding/index.html"><b>سفر راوی</b><span>معرفی به شریک رسانه‌ای، از یک پیام تا عدد قابل اثبات</span></a>
    <a href="decision-room/index.html"><b>اتاق تصمیم</b><span>آمادگی، اقتصاد هر کمپین و تصمیم‌های باز</span></a>
  </div>
</main>
</body>
</html>
